name: Update public textile prices
on:
  schedule:
    - cron: '17 2 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect dated public quotations
        run: python collector.py
      - name: Commit updated prices if changed
        run: | git config user.name "github-actions[bot]" git config user.email "41898282+github-actions[bot]@users.noreply.github.com" git add data/prices.json if ! git diff --cached --quiet; then git commit -m "Update public textile quotations" git push fi
