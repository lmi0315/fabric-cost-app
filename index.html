<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172d42"><title>面料成本计算器</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f2f5f8;color:#172d42;margin:0}header{background:#172d42;color:white;padding:24px 18px}h1{font-size:24px;margin:0 0 6px}header p{margin:0;color:#d7e2ee;font-size:13px}.wrap{max-width:680px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #1425360d}h2{font-size:17px;margin:0 0 14px}label{display:block;font-size:13px;color:#526478;margin:12px 0 5px}input,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #d5dde5;border-radius:9px;background:#fff;color:#172d42;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ingredient{display:grid;grid-template-columns:1.6fr 1fr 32px;gap:8px;align-items:end;margin:9px 0}.ingredient button{height:43px}.ingredient label{margin:0 0 4px}button{border:0;background:#e5edf3;color:#172d42;border-radius:9px;padding:10px;font-size:15px;cursor:pointer}.primary{background:#16628d;color:white;width:100%;padding:14px;font-weight:700;margin-top:14px}.secondary{margin-top:9px;width:100%}.metric{font-size:28px;font-weight:800;color:#14628c}.muted{color:#64748b;font-size:12px;line-height:1.6}.result{display:none}.breakdown{width:100%;border-collapse:collapse;font-size:14px}.breakdown td{padding:9px 2px;border-bottom:1px solid #edf0f4}.breakdown td:last-child{text-align:right;font-variant-numeric:tabular-nums}.warn{color:#a55d0b;font-size:13px}.history-item{border-bottom:1px solid #edf0f4;padding:10px 0;font-size:14px}.history-item button{float:right;font-size:12px}.row{display:flex;justify-content:space-between;gap:10px}small{font-size:12px}footer{padding:20px;text-align:center;color:#718096;font-size:12px}</style></head><body><header><h1>面料成本计算器</h1><p>服装成分分析 · 成衣成本区间 · 售价对比</p></header><main class="wrap"><section class="card"><h2>商品信息</h2><label>商品名称</label><input id="name" placeholder="例如：美利奴羊毛速干内衣"><div class="grid"><div><label>服装类型</label><select id="type"><option value="top">长袖上衣</option><option value="set">内衣套装</option><option value="tee">短袖T恤</option><option value="pants">长裤</option><option value="sweater">针织毛衣</option></select></div><div><label>商品售价（元）</label><input id="price" type="number" min="0" placeholder="例如 176"></div></div><div class="grid"><div><label>面料克重（g/㎡）</label><input id="gsm" type="number" min="30" value="180"></div><div><label>面料用量（㎡）</label><input id="area" type="number" min="0.1" step="0.1" value="1.6"></div></div><p class="muted">用量是裁剪前的估计面料面积；不同尺码、版型、裁剪效率差异较大。更换服装类型将填入参考值，可自行修改。</p></section><section class="card"><h2>面料成分（质量百分比）</h2><div id="ingredients"></div><button class="secondary" id="add">＋ 添加一种材质</button><p id="sum" class="muted"></p></section><section class="card"><h2>成本假设</h2><div class="grid"><div><label>加工、染整及辅料基准（元/件）</label><input id="processing" type="number" min="0" value="28"></div><div><label>损耗率（%）</label><input id="loss" type="number" min="0" max="80" value="12"></div></div><p class="muted">内置纤维单价为演示性估算假设（人民币/公斤），并非实时行情或厂商采购报价。加工费含纺织、染整、缝制、辅料及包装的简化估计。</p><button class="primary" id="calc">计算成本区间</button></section><section class="card result" id="result"><h2>估算结果</h2><div class="muted">单件成衣估算生产成本</div><div class="metric" id="range"></div><div id="ratio"></div><table class="breakdown" id="breakdown"></table><p class="warn">仅供服装成本比较，不代表实际出厂价、批发价或零售价；品牌溢价、渠道费用、税费、研发与退货损耗未完整计入。</p><button class="secondary" id="save">保存本次结果</button></section><section class="card"><div class="row"><h2>历史记录</h2><button id="clear">清空</button></div><div id="history" class="muted">暂无记录</div></section></main><footer>离线可计算 · 数据保存在当前设备浏览器</footer><script>
const fibers=[['聚酯纤维',9],['锦纶/聚酰胺',22],['氨纶',45],['粘胶纤维',15],['莫代尔',28],['莱赛尔/天丝',32],['腈纶',17],['聚丙烯纤维',14],['棉',19],['精梳棉',27],['普通羊毛',70],['美利奴羊毛',140],['羊绒',450],['桑蚕丝',340],['亚麻',38],['其他',25]];
const presets={top:[180,1.6,28],set:[180,3.0,48],tee:[160,1.2,22],pants:[210,1.7,30],sweater:[300,1.6,48]};
const $=id=>document.getElementById(id);function addRow(f='聚酯纤维',pct=''){let d=document.createElement('div');d.className='ingredient';d.innerHTML='<div><label>材质</label><select class="fiber"></select></div><div><label>占比 %</label><input class="pct" type="number" min="0" max="100" step="0.1" placeholder="0"></div><button type="button" aria-label="删除">×</button>';const s=d.querySelector('select');fibers.forEach(([n])=>{let o=document.createElement('option');o.textContent=n;o.value=n;s.append(o)});s.value=f;d.querySelector('input').value=pct;d.querySelector('button').onclick=()=>{d.remove();updateSum()};d.querySelector('input').oninput=updateSum;$('ingredients').append(d);updateSum()}
function rows(){return [...document.querySelectorAll('.ingredient')].map(d=>({fiber:d.querySelector('select').value,pct:Number(d.querySelector('input').value)}))}function updateSum(){let total=rows().reduce((a,b)=>a+b.pct,0);$('sum').textContent=`当前合计：${total.toFixed(1)}%（必须等于100%）`;$('sum').style.color=Math.abs(total-100)<.01?'#247a56':'#b45d19'}
$('add').onclick=()=>addRow();$('type').onchange=()=>{let [g,a,p]=presets[$('type').value];$('gsm').value=g;$('area').value=a;$('processing').value=p};
let current=null;$('calc').onclick=()=>{let r=rows(),sum=r.reduce((a,b)=>a+b.pct,0),gsm=Number($('gsm').value),area=Number($('area').value),processing=Number($('processing').value),loss=Number($('loss').value),price=Number($('price').value);if(Math.abs(sum-100)>.01){alert('面料成分比例合计必须为100%');return}if(gsm<=0||area<=0||processing<0||loss<0||loss>80){alert('请检查克重、用量、加工费及损耗率');return}let weighted=r.reduce((a,b)=>a+(fibers.find(x=>x[0]===b.fiber)?.[1]||25)*b.pct/100,0);let kg=gsm*area/1000;let raw=weighted*kg*(1+loss/100);let center=raw+processing;let low=raw*.7+processing*.7,high=raw*1.5+processing*1.5;current={name:$('name').value||'未命名服装',date:new Date().toLocaleString('zh-CN'),low,high,center,price,r,gsm,area,processing,loss};$('range').textContent=`¥${low.toFixed(1)} – ¥${high.toFixed(1)}`;$('ratio').textContent=price>0?`售价 ¥${price.toFixed(1)}，约为估算成本的 ${(price/high).toFixed(1)}–${(price/low).toFixed(1)} 倍`:'未填写售价';$('breakdown').innerHTML=`<tr><td>面料用量（估计）</td><td>${kg.toFixed(3)} kg</td></tr><tr><td>混纺纤维参考单价</td><td>¥${weighted.toFixed(1)}/kg</td></tr><tr><td>纤维原料含损耗</td><td>¥${raw.toFixed(1)}</td></tr><tr><td>加工、染整及辅料</td><td>¥${processing.toFixed(1)}</td></tr><tr><td>中心估算</td><td>¥${center.toFixed(1)}</td></tr>`;$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth',block:'start'})};
function renderHistory(){let list=JSON.parse(localStorage.getItem('fabricHistory')||'[]');$('history').innerHTML='';if(!list.length){$('history').textContent='暂无记录';return}list.forEach((x,i)=>{let d=document.createElement('div');d.className='history-item';let b=document.createElement('button');b.textContent='删除';b.onclick=()=>{list.splice(i,1);localStorage.setItem('fabricHistory',JSON.stringify(list));renderHistory()};let name=document.createElement('strong');name.textContent=x.name;let sub=document.createElement('div');sub.className='muted';sub.textContent=`${x.date} · ¥${x.low.toFixed(1)}–¥${x.high.toFixed(1)} · 售价 ¥${x.price||0}`;d.append(b,name,sub);$('history').append(d)})}
$('save').onclick=()=>{if(!current)return;let a=JSON.parse(localStorage.getItem('fabricHistory')||'[]');a.unshift(current);localStorage.setItem('fabricHistory',JSON.stringify(a.slice(0,100)));renderHistory();alert('已保存到本机浏览器')};$('clear').onclick=()=>{if(confirm('确定清空全部历史记录？')){localStorage.removeItem('fabricHistory');renderHistory()}};addRow('聚酯纤维',50);addRow('美利奴羊毛',30);addRow('氨纶',20);renderHistory();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
