<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143e64"><meta name="description" content="纤维行情和服装生产成本估算"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>面料成本计算器 V2</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#1d3447;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#143e64,#287b9b);color:white;padding:28px 18px 24px}main{max-width:780px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #17395710}h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}.muted,small{color:#6b7c89;font-size:12px}header .muted{color:#dbe8f1}.line{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:10px 0;flex-wrap:wrap}.line label{flex:1;min-width:110px}input,select{padding:11px;border:1px solid #d7e0e8;border-radius:9px;font-size:15px;background:#fff;max-width:100%}input[type=number]{width:100px}button{border:0;background:#176b93;color:#fff;border-radius:10px;padding:12px 16px;font-size:14px;cursor:pointer}.secondary{background:#eaf1f5;color:#194864}.price{font-size:22px;font-weight:750;color:#176b93}.tag{font-size:11px;border-radius:30px;background:#e9f2fa;color:#17628a;padding:4px 9px}.warn{color:#a66011}.good{color:#167351}.ingredient{display:grid;grid-template-columns:1fr 88px 38px;gap:8px;margin:9px 0;align-items:center}.ingredient select,.ingredient input{width:100%}.result{background:#eef6fb;border-radius:12px;padding:16px}.result strong{font-size:22px;color:#154f76}.market{border-bottom:1px solid #eef1f5;padding:11px 0}.market:last-child{border:0}.bar{height:6px;background:#e3edf4;border-radius:10px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#237b9d}.error{color:#b45a34}.footer{font-size:12px;line-height:1.7;color:#71808b;margin-bottom:30px}#history>div{padding:10px 0;border-bottom:1px solid #edf1f4}a{color:#176b93}details{margin-top:8px}summary{cursor:pointer}</style></head><body><header><div style="max-width:780px;margin:auto"><div class="tag" style="display:inline-block;background:#ffffff29;color:white">V2.0 · 免费公开行情</div><h1>面料成本计算器</h1><div class="muted">看懂纤维报价，估算服装真实生产成本</div></div></header><main><section class="card"><div class="line"><h2 style="margin:0">市场行情</h2><button id="refresh" class="secondary">刷新报价</button></div><div id="status" class="muted">正在加载报价…</div><div id="market"></div></section><section class="card"><h2>成衣成本估算</h2><div class="line"><label>服装类型</label><select id="type"><option value="top">上衣 / 速干衣</option><option value="set">保暖内衣套装</option><option value="sweater">毛衣 / 针织衫</option><option value="pants">裤子</option></select></div><div class="line"><label>成衣净重（克）</label><input id="weight" type="number" value="300" min="50" max="5000"></div><div class="line"><label>商家售价（元）</label><input id="retail" type="number" value="199" min="0" max="999999"></div><div class="line"><label>材料利用率（%）</label><input id="yield" type="number" value="85" min="40" max="100"></div><div class="line"><label>织造染整等加工费（元/kg）</label><input id="process" type="number" value="30" min="0" max="1000"></div><div class="line"><label>裁剪缝制+辅料包装（元/件）</label><input id="labor" type="number" value="22" min="0" max="10000"></div><h2 style="margin-top:18px">面料成分</h2><div id="ingredients"></div><div class="line"><button id="add" class="secondary">+ 增加成分</button><span id="total" class="muted">合计 0%</span></div><button id="calc" style="width:100%">计算成本</button><div id="output" style="margin-top:14px"></div></section><section class="card"><h2>本机计算历史</h2><div id="history"></div><button id="clear" class="secondary">清空历史</button></section><div class="footer">行情为公开网页可核验报价，不保证每日都有更新。原料规格、纱支、采购量、工艺、品牌溢价等会显著影响实际成本。无公开报价的材料使用可编辑参考值，不代表当日成交价。历史记录仅保存在当前设备。</div></main><script>
const defs={polyester:['涤纶短纤 / 聚酯',9],spandex:['氨纶',29],viscose:['粘胶短纤',15],cotton:['棉花 / 皮棉',17],nylon:['锦纶POY',17],acrylic:['腈纶（丙烯腈参考）',18],merino:['美利奴羊毛（参考）',120],wool:['普通羊毛（参考）',65],modal:['莫代尔（参考）',27],lyocell:['莱赛尔（参考）',32],polypropylene:['丙纶（参考）',13],silk:['真丝（参考）',360],linen:['亚麻（参考）',42]};
let market={},observed=null;const $=s=>document.querySelector(s),fmt=n=>Number(n).toFixed(2);const opts=Object.entries(defs).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
function row(k='polyester',p=50){const d=document.createElement('div');d.className='ingredient';d.innerHTML=`<select aria-label="纤维种类">${opts}</select><input aria-label="占比" type="number" min="0" max="100" value="${p}"><button class="secondary" aria-label="删除">×</button>`;d.querySelector('select').value=k;d.querySelector('button').onclick=()=>{d.remove();sum()};d.querySelector('input').oninput=sum;$('#ingredients').append(d);sum()}
function sum(){let t=[...document.querySelectorAll('.ingredient input')].reduce((s,e)=>s+(+e.value||0),0);$('#total').textContent='合计 '+fmt(t)+'%';$('#total').className=Math.abs(t-100)<.01?'good':'error'}
function validPrice(k){const p=market[k];if(!p)return null;const age=(Date.now()-new Date(p.date+'T00:00:00+08:00'))/86400000;return age>=-1&&age<=30?Number(p.priceYuanPerKg):null}
function currentPrice(k){return validPrice(k)??defs[k][1]}
function drawMarket(){let out='';for(const [k,v] of Object.entries(defs)){const p=market[k],valid=validPrice(k)!==null;out+=`<div class="market"><div class="line" style="margin:0"><b>${v[0]}</b><span class="price">¥${fmt(currentPrice(k))}<small> / kg</small></span></div><div class="line" style="margin:4px 0"><span class="muted">${valid?'公开行情 · '+p.date:'内置参考价 · 非实时'}</span><span class="tag">${valid?'市场报价':'估算参考'}</span></div>${valid?`<small>${p.specification||''} · <a href="${p.sourceUrl}" target="_blank" rel="noopener noreferrer">${p.source||'来源'}</a></small>`:''}</div>`}$('#market').innerHTML=out}
async function refresh(){ $('#status').textContent='正在获取公开行情…';try{const r=await fetch('./data/prices.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);observed=await r.json();market=observed.prices||{};localStorage.setItem('fabric-market-v2',JSON.stringify(observed));const n=Object.keys(market).filter(k=>validPrice(k)!==null).length;$('#status').textContent=`${n} 种材料有近30日内报价 · 数据更新：${observed.updatedAt?new Date(observed.updatedAt).toLocaleString('zh-CN'):'尚未执行采集'}`;if(!n)$('#status').textContent+=' · 当前采用参考估价';}catch(e){try{observed=JSON.parse(localStorage.getItem('fabric-market-v2')||'{}');market=observed.prices||{};$('#status').textContent='网络不可用，使用已缓存报价或参考估价';}catch{$('#status').textContent='行情不可用，使用内置参考估价'}}drawMarket()}
function calculate(){const lines=[...document.querySelectorAll('.ingredient')].map(d=>({key:d.querySelector('select').value,p:+d.querySelector('input').value}));const total=lines.reduce((s,x)=>s+x.p,0);if(!lines.length||Math.abs(total-100)>.01||lines.some(x=>!Number.isFinite(x.p)||x.p<0)){alert('请确保成分占比合计为100%');return}const weight=+$('#weight').value,yieldRate=+$('#yield').value,process=+$('#process').value,labor=+$('#labor').value,retail=+$('#retail').value;if(!(weight>=50&&weight<=5000&&yieldRate>=40&&yieldRate<=100&&process>=0&&labor>=0&&retail>=0)){alert('请检查重量、利用率和费用输入');return}const kg=weight/1000/(yieldRate/100),avg=lines.reduce((s,x)=>s+currentPrice(x.key)*x.p/100,0),raw=kg*avg,base=raw+kg*process+labor,low=base*.85,high=base*1.35,ratio=retail/base,ref=lines.filter(x=>validPrice(x.key)===null).map(x=>defs[x.key][0]);$('#output').innerHTML=`<div class="result"><div class="muted">估算单件出厂成本区间</div><strong>¥${fmt(low)} – ¥${fmt(high)}</strong><div class="line"><span>纤维原料</span><b>¥${fmt(raw)}</b></div><div class="line"><span>织造染整</span><b>¥${fmt(kg*process)}</b></div><div class="line"><span>裁剪缝制/辅料/包装</span><b>¥${fmt(labor)}</b></div><div class="line"><span>基准成本</span><b>¥${fmt(base)}</b></div><div class="line"><span>零售价 / 基准成本</span><b>${fmt(ratio)} 倍</b></div><small>区间为基准成本×0.85～1.35的情景估计，不是工厂真实报价。</small>${ref.length?`<p class="warn" style="font-size:12px">使用参考价的材料：${ref.join('、')}。其成本不属于实时市场报价。</p>`:''}</div>`;let history=JSON.parse(localStorage.getItem('fabric-history-v2')||'[]');history.unshift({time:new Date().toLocaleString('zh-CN'),weight,retail,low,high});localStorage.setItem('fabric-history-v2',JSON.stringify(history.slice(0,30)));showHistory()}
function showHistory(){let h=[];try{h=JSON.parse(localStorage.getItem('fabric-history-v2')||'[]')}catch{}$('#history').innerHTML=h.length?h.map(x=>`<div><b>¥${fmt(x.low)}–${fmt(x.high)}</b> <small>售价 ¥${fmt(x.retail)} · ${x.weight}g · ${x.time}</small></div>`).join(''):'<div class="muted">暂无计算记录</div>'}
$('#add').onclick=()=>row('spandex',0);$('#calc').onclick=calculate;$('#refresh').onclick=refresh;$('#clear').onclick=()=>{if(confirm('清空本机历史记录？')){localStorage.removeItem('fabric-history-v2');showHistory()}};$('#type').onchange=()=>{const x=$('#type').value;$('#weight').value=({top:300,set:550,sweater:500,pants:450})[x];$('#labor').value=({top:22,set:38,sweater:35,pants:30})[x]};row('polyester',70);row('spandex',10);row('viscose',20);refresh();showHistory();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
